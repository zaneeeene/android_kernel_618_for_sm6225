name: SM6225 Gate 4 module coverage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BUILD_ROOT: /home/runner/tapas-k618-build
      JOBS: 4
      K618_INPUT_SPEC: provenance/input-sources-gate1.json
    steps:
      - name: Check out integration
        uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true
      - name: Restore source workspace
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/tapas-k618-build/.tapas-k618-upstream
            /home/runner/tapas-k618-build/k618/ws
            /home/runner/tapas-k618-build/k618/soc
            /home/runner/tapas-k618-build/k618/src/topaz
            /home/runner/tapas-k618-build/k618/KernelSU
            /home/runner/tapas-k618-build/k618/susfs4ksu
            /home/runner/tapas-k618-build/lz4-dev
          key: ${{ runner.os }}-sm6225-gate1-inputs-${{ hashFiles('provenance/input-sources-gate1.json', 'patches/soc-sm8550.patch') }}
          restore-keys: |
            ${{ runner.os }}-sm6225-gate1-inputs-
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 rsync make bc bison flex \
            libssl-dev libelf-dev libdw-dev libncurses-dev zlib1g-dev \
            cpio lz4 zstd kmod zip unzip file binutils \
            systemd util-linux pkg-config erofs-utils python3-zstandard
      - name: Fetch pinned sources
        run: bash scripts/run-limited.sh bootstrap --only sources
      - name: Build and audit first-stage modules
        run: bash scripts/run-limited.sh gate4
      - name: Collect coverage
        if: always()
        run: |
          mkdir -p gate4-artifacts
          cp -f "$BUILD_ROOT/gate4-coverage.json" gate4-artifacts/ 2>/dev/null || true
          cp -f "$BUILD_ROOT/gate4-binding-audit.json" gate4-artifacts/ 2>/dev/null || true
          cp -f "$BUILD_ROOT/k618/out-gki/.config" gate4-artifacts/gki.config 2>/dev/null || true
          cp -f "$BUILD_ROOT/k618/gki-build.log" gate4-artifacts/ 2>/dev/null || true
          cp -f "$BUILD_ROOT/k618/soc-build.log" gate4-artifacts/ 2>/dev/null || true
          cp -f "$BUILD_ROOT/k618/soc-errors.txt" gate4-artifacts/ 2>/dev/null || true
          find "$BUILD_ROOT/k618/out-gki" "$BUILD_ROOT/k618/soc" -name '*.ko' -printf '%f\n' \
            | sort -u > gate4-artifacts/rebuilt-module-names.txt
          if [ -d "$BUILD_ROOT/k618/out-gki" ]; then
            ( cd "$BUILD_ROOT/k618/out-gki" && \
              find . -type f -name '*.ko' -print0 | sort -z | \
              tar --null -T - -cf "$GITHUB_WORKSPACE/gate4-artifacts/gki-modules.tar" )
          fi
          if [ -d "$BUILD_ROOT/k618/soc" ]; then
            ( cd "$BUILD_ROOT/k618/soc" && \
              find . -type f -name '*.ko' -print0 | sort -z | \
              tar --null -T - -cf "$GITHUB_WORKSPACE/gate4-artifacts/soc-modules.tar" )
          fi
          cp -f "$BUILD_ROOT/k618/out-gki/arch/arm64/boot/Image" \
            gate4-artifacts/Image-ACK-6.18-GATE4-NOT-FLASHABLE 2>/dev/null || true
          cp -f "$BUILD_ROOT/k618/out-gki/Module.symvers" gate4-artifacts/gki-Module.symvers 2>/dev/null || true
          cp -f "$BUILD_ROOT/k618/soc/Module.symvers" gate4-artifacts/soc-Module.symvers 2>/dev/null || true
          if [ -d "$BUILD_ROOT/gate4-payload" ]; then
            cp -f "$BUILD_ROOT/gate4-payload/payload-report.json" gate4-artifacts/ 2>/dev/null || true
            ( cd "$BUILD_ROOT/gate4-payload" && \
              tar -cf "$GITHUB_WORKSPACE/gate4-artifacts/gate4-module-payload-NOT-FLASHABLE.tar" . )
          fi
          ls -lh gate4-artifacts
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sm6225-gate4-coverage
          path: gate4-artifacts/
          if-no-files-found: warn
          retention-days: 14
